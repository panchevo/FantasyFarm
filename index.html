            const isLocked = i > unlockedLevel;
            const isCompleted = levelCompleted[i];
            const isCurrent = i === unlockedLevel && !isCompleted;
            
            if (isLocked) btn.classList.add('locked');
            if (isCompleted) btn.classList.add('completed');
            if (isCurrent) btn.classList.add('current');
            
            const stars = levelStars[i] || 0;
            const starsStr = stars > 0 ? '⭐'.repeat(stars) : '—';
            
            btn.innerHTML = `
                <div class="level-num">${i+1}</div>
                <div style="font-size:0.6rem;color:#4a3a1e;font-style:italic;">${level.name}</div>
                <div class="level-stars">${starsStr}</div>
                <div class="level-status">${isCompleted ? '✅' : isLocked ? '🔒' : '▶️'}</div>
            `;
            
            if (!isLocked) {
                btn.addEventListener('click', () => startLevel(i));
            }
            levelGrid.appendChild(btn);
        }
    }

    // ---------- ЗАПУСК УРОВНЯ ----------
    function startLevel(index) {
        const level = LEVELS[index];
        if (!level) return;
        
        // Закрываем меню
        levelMenu.classList.add('hidden');
        levelComplete.classList.remove('show');
        
        currentLevel = index;
        isLevelComplete = false;
        
        // Очищаем поле
        clearField();
        
        // Устанавливаем начальные параметры
        gems = level.startGems || 20;
        water = level.startWater || 10;
        grassCount = 0;
        resources = { firebird:0, baranets:0, volkolak:0, nochnitsa:0, basilisk:0, unicorn:0 };
        craftedItems = { nest:0, spider:0, wolf:0, lunar:0, gorgon:0, philosopher:0 };
        
        // Обновляем UI
        updateUI();
        updateLevelGoals();
        updateBuildPanel();
        updateShopButtons();
        
        // Создаём колодец и стартовых существ
        setTimeout(() => createWell(), 100);
        setTimeout(() => {
            // Запускаем стартовых существ в зависимости от уровня
            const startCreatures = level.startCreatures || ['firebird', 'baranets'];
            for (let type of startCreatures) {
                if (level.availableCreatures.includes(type)) {
                    spawnCreature(type);
                }
            }
            if (animationFrame) cancelAnimationFrame(animationFrame);
            updateMovement();
        }, 200);
        
        // Запускаем таймер уровня
        levelStartTime = Date.now();
        if (levelTimer) clearInterval(levelTimer);
        levelTimer = setInterval(updateLevelTimer, 1000);
        
        // Запускаем игровой цикл
        if (gameLoopInterval) clearInterval(gameLoopInterval);
        gameLoopInterval = setInterval(() => {
            processHunger();
            refillWell();
            checkLevelCompletion();
        }, 2000);
        
        // Обновляем заголовок
        levelDisplay.textContent = `Уровень ${level.id}: ${level.name}`;
        document.getElementById('levelProgressText').textContent = '';
        
        // Показываем уведомление
        showHarvestPopup(`🏁 Уровень ${level.id}: ${level.name}`);
    }

    function clearField() {
        // Удаляем все элементы с поля
        for (let r of resourcesOnField) { if (r.timer) clearTimeout(r.timer); if (r.element && r.element.parentNode) r.element.remove(); }
        for (let c of creatures) { if (c.dropInterval) clearInterval(c.dropInterval); if (c.element && c.element.parentNode) c.element.remove(); }
        for (let b of buildings) { if (b.element && b.element.parentNode) b.element.remove(); }
        for (let g of grassTiles) { if (g.element && g.element.parentNode) g.element.remove(); }
        if (well && well.element) { well.element.remove(); well = null; }
        creatures = []; resourcesOnField = []; buildings = []; grassTiles = [];
        exitBuildMode();
    }

    function resetCurrentLevel() {
        if (isLevelComplete) return;
        startLevel(currentLevel);
        showHarvestPopup('🔄 Уровень перезапущен');
    }

    // ---------- ПРОВЕРКА ВЫПОЛНЕНИЯ УРОВНЯ ----------
    function checkLevelCompletion() {
        if (isLevelComplete) return;
        const level = LEVELS[currentLevel];
        if (!level) return;
        
        let allDone = true;
        for (let goal of level.goals) {
            if (!checkGoal(goal)) { allDone = false; break; }
        }
        
        if (allDone) {
            completeLevel();
        }
    }

    function checkGoal(goal) {
        if (goal.type === 'resource') {
            return (resources[goal.id] || 0) >= goal.count;
        } else if (goal.type === 'crafted') {
            return (craftedItems[goal.id] || 0) >= goal.count;
        } else if (goal.type === 'creature') {
            const count = creatures.filter(c => c.alive && c.type === goal.id).length;
            return count >= goal.count;
        } else if (goal.type === 'building') {
            const count = buildings.filter(b => b.craftType === goal.id).length;
            return count >= goal.count;
        } else if (goal.type === 'score') {
            return getScore() >= goal.count;
        }
        return false;
    }

    function getScore() {
        let score = 0;
        for (let [key, val] of Object.entries(resources)) {
            const type = CREATURE_TYPES[key];
            if (type) score += val * type.sellPrice;
        }
        for (let [key, val] of Object.entries(craftedItems)) {
            const bonus = BUILDING_BONUS[key] || 0;
            score += val * bonus * 2;
        }
        score += gems * 2;
        return score;
    }

    function completeLevel() {
        if (isLevelComplete) return;
        isLevelComplete = true;
        
        const level = LEVELS[currentLevel];
        const elapsed = (Date.now() - levelStartTime) / 1000;
        const thresholds = level.starThresholds || [999, 999, 999];
        
        let stars = 3;
        if (elapsed > thresholds[0]) stars = 2;
        if (elapsed > thresholds[1]) stars = 1;
        if (elapsed > thresholds[2]) stars = 0;
        
        // Сохраняем результат
        if (stars > levelStars[currentLevel]) {
            levelStars[currentLevel] = stars;
        }
        levelCompleted[currentLevel] = true;
        if (currentLevel + 1 > unlockedLevel && currentLevel + 1 < LEVELS.length) {
            unlockedLevel = currentLevel + 1;
        }
        
        // Показываем окно завершения
        const starText = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
        completeStars.textContent = starText;
        const timeStr = Math.floor(elapsed / 60) + 'м ' + Math.floor(elapsed % 60) + 'с';
        completeText.innerHTML = `
            Уровень ${level.id}: ${level.name}<br>
            ⏱️ ${timeStr}<br>
            🎯 ${stars} звезды!<br>
            💎 ${gems} алмазов
        `;
        
        // Кнопка "Следующий уровень"
        if (currentLevel + 1 < LEVELS.length) {
            nextLevelBtn.style.display = 'inline-block';
            nextLevelBtn.textContent = `➡️ Уровень ${LEVELS[currentLevel+1].id}`;
        } else {
            nextLevelBtn.style.display = 'inline-block';
            nextLevelBtn.textContent = '🏆 Все уровни пройдены!';
        }
        
        levelComplete.classList.add('show');
        renderLevelMenu();
        updateUI();
        
        // Останавливаем игровой цикл
        if (gameLoopInterval) clearInterval(gameLoopInterval);
    }

    function updateLevelGoals() {
        const level = LEVELS[currentLevel];
        if (!level) return;
        
        levelProgress.innerHTML = '';
        for (let goal of level.goals) {
            const div = document.createElement('div');
            div.className = 'goal-item';
            let emoji = '📦', current = 0, total = goal.count;
            
            if (goal.type === 'resource') {
                const type = CREATURE_TYPES[goal.id];
                emoji = type ? type.emoji : '📦';
                current = resources[goal.id] || 0;
            } else if (goal.type === 'crafted') {
                const product = CRAFTED_PRODUCTS[goal.id];
                emoji = product ? product.emoji : '🔧';
                current = craftedItems[goal.id] || 0;
            } else if (goal.type === 'creature') {
                const type = CREATURE_TYPES[goal.id];
                emoji = type ? type.emoji : '🐾';
                current = creatures.filter(c => c.alive && c.type === goal.id).length;
            } else if (goal.type === 'building') {
                emoji = '🏗️';
                current = buildings.filter(b => b.craftType === goal.id).length;
            } else if (goal.type === 'score') {
                emoji = '⭐';
                current = getScore();
            }
            
            const done = current >= total;
            if (done) div.classList.add('done');
            
            div.innerHTML = `
                <span class="goal-emoji">${emoji}</span>
                <span class="goal-count">${current}/${total}</span>
            `;
            levelProgress.appendChild(div);
        }
    }

    function updateLevelTimer() {
        if (isLevelComplete) return;
        const elapsed = Math.floor((Date.now() - levelStartTime) / 1000);
        const min = Math.floor(elapsed / 60);
        const sec = elapsed % 60;
        document.getElementById('levelProgressText').textContent = `⏱️ ${min}:${String(sec).padStart(2, '0')}`;
        updateLevelGoals();
    }

    // ---------- ОСНОВНАЯ ЛОГИКА ----------
    function updateUI() {
        gemsDisplay.textContent = gems;
        grassDisplay.textContent = grassCount;
        waterDisplay.textContent = Math.floor(water);
        creatureCountDisplay.textContent = creatures.filter(c => c.alive).length;
        for (let key of Object.keys(resources)) {
            const el = document.getElementById('stat-' + key);
            if (el) el.textContent = resources[key];
        }
        updateProcessedDisplay();
        updateBuildPanel();
        updateWellDisplay();
        updateShopButtons();
        updateLevelGoals();
        updateSellButton();
    }

    function updateProcessedDisplay() {
        const items = [];
        for (let [key, count] of Object.entries(craftedItems)) {
            if (count > 0) {
                const product = CRAFTED_PRODUCTS[key];
                items.push(`<span class="proc-item">${product.emoji} ${count}</span>`);
            }
        }
        processedDisplay.innerHTML = items.join(' ');
    }

    function updateShopButtons() {
        const level = LEVELS[currentLevel];
        if (!level) return;
        document.querySelectorAll('.shop-btn').forEach(btn => {
            const type = btn.dataset.creature;
            const available = level.availableCreatures.includes(type);
            btn.disabled = !available || isLevelComplete;
            if (!available) btn.style.opacity = '0.3';
            else btn.style.opacity = '1';
        });
    }

    function updateSellButton() {
        sellAllBtn.disabled = isLevelComplete;
        if (isLevelComplete) {
            sellAllBtn.classList.add('level-complete');
            sellAllBtn.textContent = '✅ Уровень пройден!';
        } else {
            sellAllBtn.classList.remove('level-complete');
            sellAllBtn.textContent = '💰 Продать все';
        }
    }

    function showHarvestPopup(text) { 
        popup.textContent = text || '✨ Собрано!'; 
        popup.classList.add('show'); 
        if (popupTimer) clearTimeout(popupTimer); 
        popupTimer = setTimeout(() => popup.classList.remove('show'), 900); 
    }

    function getFieldSize() { const rect = field.getBoundingClientRect(); return { w: field.clientWidth || rect.width || 600, h: field.clientHeight || rect.height || 400 }; }
    function randomPosition() { const { w, h } = getFieldSize(); const size = 50; return { x: Math.random() * (w - size - 10) + 5, y: Math.random() * (h - size - 10) + 5 }; }
    
    function isPositionFree(x, y, size = 64, ignoreWell = false, ignoreGrass = false) {
        const half = size / 2, { w, h } = getFieldSize();
        if (x - half < 0 || x + half > w || y - half < 0 || y + half > h) return false;
        for (let c of creatures) if (c.alive && c.element && c.element.parentNode) { const cx = c.x + 40, cy = c.y + 40; if (Math.hypot(x - cx, y - cy) < 56) return false; }
        for (let r of resourcesOnField) if (r.element && r.element.parentNode) { const rx = r.x + 21, ry = r.y + 21; if (Math.hypot(x - rx, y - ry) < 42) return false; }
        for (let b of buildings) if (b.element && b.element.parentNode) { const bx = b.x + 31, by = b.y + 31; if (Math.hypot(x - bx, y - by) < 56) return false; }
        if (!ignoreWell && well && well.element) { const wx = well.x + 31, wy = well.y + 31; if (Math.hypot(x - wx, y - wy) < 46) return false; }
        if (!ignoreGrass) for (let g of grassTiles) if (g.alive && g.element && g.element.parentNode) { const gx = g.x + 17, gy = g.y + 17; if (Math.hypot(x - gx, y - gy) < 28) return false; }
        return true;
    }

    // ---------- ТРАВА ----------
    function spawnGrass(x, y) {
        if (isLevelComplete) return false;
        if (!isPositionFree(x, y, 34, true, false)) return false;
        const div = document.createElement('div');
        div.className = 'grass';
        div.innerHTML = DETAILED_GRASS_SVG();
        div.style.left = (x - 17) + 'px';
        div.style.top = (y - 17) + 'px';
        field.appendChild(div);
        grassTiles.push({ x, y, element: div, alive: true });
        grassCount++;
        updateUI();
        return true;
    }
    function removeGrass(g) { if (!g || !g.alive) return; g.alive = false; if (g.element && g.element.parentNode) g.element.remove(); grassCount--; updateUI(); }

    // ---------- КОЛОДЕЦ ----------
    function createWell() {
        if (isLevelComplete) return;
        let pos = randomPosition();
        let attempts = 0;
        while (!isPositionFree(pos.x, pos.y, 62, false, true) && attempts < 30) { pos = randomPosition(); attempts++; }
        if (!isPositionFree(pos.x, pos.y, 62, false, true)) { setTimeout(createWell, 1000); return; }
        const div = document.createElement('div');
        div.className = 'well';
        div.innerHTML = DETAILED_WELL_SVG() + `<span class="well-water-label">💧 <span id="wellWaterDisplay">${Math.floor(water)}</span></span><span class="well-label">Колодец</span>`;
        div.style.left = (pos.x - 31) + 'px';
        div.style.top = (pos.y - 31) + 'px';
        field.appendChild(div);
        well = { x: pos.x, y: pos.y, element: div, water };
        div.addEventListener('click', (e) => { e.stopPropagation(); collectWater(); });
    }
    function collectWater() { if (!well || isLevelComplete) return; if (water <= 0) { showHarvestPopup('💧 Колодец пуст!'); return; } showHarvestPopup(`💧 В колодце ${Math.floor(water)} воды`); }
    function updateWellDisplay() { if (well && well.element) { const d = well.element.querySelector('#wellWaterDisplay'); if (d) d.textContent = Math.floor(water); } }
    function refillWell() { if (isLevelComplete) return; if (water < 20) { water += 0.15; if (water > 20) water = 20; updateUI(); updateWellDisplay(); } }

    // ---------- СУЩЕСТВА ----------
    function spawnCreature(typeKey) {
        if (isLevelComplete) return null;
        const level = LEVELS[currentLevel];
        if (!level.availableCreatures.includes(typeKey)) { showHarvestPopup('❌ Это существо недоступно на этом уровне'); return null; }
        
        const type = CREATURE_TYPES[typeKey];
        if (!type) return null;
        let pos = randomPosition();
        let attempts = 0;
        while (!isPositionFree(pos.x, pos.y, 80) && attempts < 30) { pos = randomPosition(); attempts++; }
        if (!isPositionFree(pos.x, pos.y, 80)) { showHarvestPopup('❌ Нет места'); return null; }
        const div = document.createElement('div');
        div.className = 'creature walking';
        div.dataset.type = typeKey;
        div.innerHTML = `<div class="ui-overlay"><div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div><div class="hp-text">❤️ ${type.maxHp}</div><span class="label">${type.label}</span></div>${type.svg}`;
        div.style.left = pos.x + 'px'; div.style.top = pos.y + 'px';
        field.appendChild(div);
        const creature = { id: Date.now()+'_'+Math.random(), type:typeKey, element:div, x:pos.x, y:pos.y, targetX:pos.x+(Math.random()-0.5)*120, targetY:pos.y+(Math.random()-0.5)*120, speed:0.3+Math.random()*0.4, hp:type.maxHp, maxHp:type.maxHp, hungerRate:type.hungerRate, alive:true, dropInterval:null, hungerTimer:0 };
        const intervals = { firebird:6000, baranets:7000, volkolak:8000, nochnitsa:9000, basilisk:10000, unicorn:12000 };
        const interval = (intervals[typeKey]||8000)+(Math.random()-0.5)*(intervals[typeKey]||8000)*0.6;
        creature.dropInterval = setInterval(() => {
            if (isLevelComplete || !creature.alive || !creature.element || !creature.element.parentNode) { 
                if (creature.dropInterval) { clearInterval(creature.dropInterval); creature.dropInterval = null; }
                return; 
            }
            const offsetX = (Math.random()-0.5)*40, offsetY = (Math.random()-0.5)*40;
            dropResource(typeKey, creature.x+offsetX, creature.y+offsetY);
            const svg = creature.element.querySelector('svg'); 
            if (svg) { 
                svg.style.transform='scale(1.2)'; 
                setTimeout(()=>{ if(svg) svg.style.transform='scale(1)'; },200); 
            }
        }, interval);
        creatures.push(creature);
        updateUI();
        return creature;
    }

    function updateCreatureHP(c) {
        if (!c.alive) return;
        const pct = Math.max(0,(c.hp/c.maxHp)*100);
        const fill = c.element.querySelector('.hp-fill'), text = c.element.querySelector('.hp-text');
        if (fill) fill.style.width = pct + '%';
        if (text) text.textContent = `❤️ ${Math.floor(c.hp)}`;
        if (c.hp <= 0) { 
            c.alive = false; 
            c.element.classList.remove('walking'); 
            c.element.classList.add('dead'); 
            if (c.dropInterval) { clearInterval(c.dropInterval); c.dropInterval=null; } 
            setTimeout(()=>{ if(c.element && c.element.parentNode) c.element.remove(); },5000); 
            updateUI(); 
            showHarvestPopup(`💀 ${CREATURE_TYPES[c.type].label} умер`); 
        }
    }

    function processHunger() {
        if (isLevelComplete) return;
        for (let c of creatures) {
            if (!c.alive) continue;
            let closest = null, dist = Infinity;
            for (let g of grassTiles) if (g.alive && g.element && g.element.parentNode) { 
                const d = Math.hypot(c.x-g.x, c.y-g.y); 
                if (d<dist) { dist=d; closest=g; } 
            }
            if (closest && dist < 65) {
                if (c.hp < c.maxHp) {
                    removeGrass(closest);
                    c.hp = Math.min(c.maxHp, c.hp + 25);
                    c.hungerTimer = 0;
                    if (c.element) {
                        const svg = c.element.querySelector('svg');
                        if (svg) {
                            svg.style.transform = 'scale(1.3)';
                            svg.style.filter = 'drop-shadow(0 0 20px #7fdb7f)';
                            setTimeout(() => { 
                                if(svg) {
                                    svg.style.transform = 'scale(1)';
                                    svg.style.filter = '';
                                }
                            }, 300);
                        }
                    }
                }
            } else if (closest && dist < 300 && c.hp < c.maxHp) {
                c.targetX = closest.x;
                c.targetY = closest.y;
            } else {
                if (c.hp < c.maxHp) {
                    c.hungerTimer += 4.0;   // было 2.0 — ускорено в 2 раза
                    if (c.hungerTimer >= 1) { 
                        c.hp -= c.hungerRate * 2; 
                        c.hungerTimer = 0; 
                    }
                } else {
                    c.hungerTimer += 2.0;   // было 0.5 — сытые тоже начинают терять быстрее
                    if (c.hungerTimer >= 1) { 
                        c.hp -= 0.25;           // было 0.1 — урон выше
                        c.hungerTimer = 0; 
                    }
                }
            }
            updateCreatureHP(c);
        }
        updateUI();
    }

    function updateMovement() {
        for (let c of creatures) {
            if (!c.alive || !c.element || !c.element.parentNode) continue;
            const { w, h } = getFieldSize();
            const margin = 40; // половина размера существа 80/2 = 40
            const minX = margin, maxX = w - margin;
            const minY = margin, maxY = h - margin;

            const dx = c.targetX - c.x, dy = c.targetY - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 2.0) {
                // новая цель — обязательно внутри поля
                const np = randomPosition();
                c.targetX = Math.max(minX, Math.min(maxX, np.x));
                c.targetY = Math.max(minY, Math.min(maxY, np.y));
            } else {
                const speed = c.speed||0.5, angle = Math.atan2(dy, dx);
                c.x += Math.cos(angle)*speed;
                c.y += Math.sin(angle)*speed;

                // --- ЖЁСТКОЕ ОГРАНИЧЕНИЕ ПОЛЕМ ---
                if (c.x < minX) { c.x = minX; c.targetX = Math.min(maxX, Math.max(minX, c.targetX)); }
                if (c.x > maxX) { c.x = maxX; c.targetX = Math.min(maxX, Math.max(minX, c.targetX)); }
                if (c.y < minY) { c.y = minY; c.targetY = Math.min(maxY, Math.max(minY, c.targetY)); }
                if (c.y > maxY) { c.y = maxY; c.targetY = Math.min(maxY, Math.max(minY, c.targetY)); }

                // если цель ушла за пределы — перегенерировать
                if (c.targetX < minX || c.targetX > maxX || c.targetY < minY || c.targetY > maxY) {
                    const np = randomPosition();
                    c.targetX = Math.max(minX, Math.min(maxX, np.x));
                    c.targetY = Math.max(minY, Math.min(maxY, np.y));
                }

                const svg = c.element.querySelector('svg');
                if (svg) svg.style.transform = `scaleX(${Math.cos(angle)>=0?1:-1})`;
            }
            c.element.style.left = c.x + 'px'; c.element.style.top = c.y + 'px';
        }
        animationFrame = requestAnimationFrame(updateMovement);
    }

    // ---------- РЕСУРСЫ ----------
    function dropResource(typeKey, x, y) {
        if (isLevelComplete) return;
        const level = LEVELS[currentLevel];
        if (!level.availableCreatures.includes(typeKey)) return;
        const type = CREATURE_TYPES[typeKey];
        if (!type) return;
        if (!isPositionFree(x, y, 42, false, true)) { for (let i=0; i<10; i++) { const nx=x+(Math.random()-0.5)*60, ny=y+(Math.random()-0.5)*60; if (isPositionFree(nx,ny,42,false,true)) { x=nx; y=ny; break; } } if (!isPositionFree(x,y,42,false,true)) return; }
        const div = document.createElement('div');
        div.className = 'resource-item';
        div.dataset.resType = type.resType;
        const svg = RESOURCE_SVGS[typeKey] || RESOURCE_SVGS.firebird;
        div.innerHTML = svg + `<span class="r-label">${type.resName}</span>`;
        div.style.left = (x+9) + 'px'; div.style.top = (y+18) + 'px';
        field.appendChild(div);
        const obj = { id: nextResourceId++, type: typeKey, resType: type.resType, element: div, x, y, timer: setTimeout(() => { if (obj.element && obj.element.parentNode) { obj.element.classList.add('fading'); setTimeout(()=>{ if(obj.element && obj.element.parentNode) { obj.element.remove(); const idx=resourcesOnField.indexOf(obj); if(idx!==-1) resourcesOnField.splice(idx,1); }},1000); } }, 15000) };
        div.addEventListener('click', (e) => { e.stopPropagation(); collectResource(obj); });
        resourcesOnField.push(obj);
    }

    function collectResource(obj) {
        if (isLevelComplete) return;
        if (obj.timer) { clearTimeout(obj.timer); obj.timer=null; }
        resources[obj.resType] = (resources[obj.resType]||0)+1;
        if (obj.element && obj.element.parentNode) obj.element.remove();
        const idx = resourcesOnField.indexOf(obj); if (idx!==-1) resourcesOnField.splice(idx,1);
        const type = CREATURE_TYPES[obj.type];
        showHarvestPopup(`+1 ${type.resName} (${type.emoji})`);
        updateUI();
    }

    // ---------- ПЕРЕРАБОТКА ----------
    function startCrafting(buildingData) {
    if (isLevelComplete) return;
    const craftType = buildingData.craftType;
    const level = LEVELS[currentLevel];
    if (!level.availableBuildings.includes(craftType)) { showHarvestPopup('❌ Это здание недоступно на этом уровне'); return; }
    
    const resType = BUILDING_RESOURCE_MAP[craftType];
    if (!resType) return;
    if (resources[resType] < 1) {
        showHarvestPopup(`❌ Нет ${CREATURE_TYPES[resType].resName} для переработки!`);
        return;
    }
    if (buildingData.processing) {
        showHarvestPopup(`⏳ Уже идёт переработка...`);
        return;
    }
    resources[resType]--;
    buildingData.processing = true;
    const element = buildingData.element;
    element.classList.add('processing');
    
    // --- СОЗДАЁМ ПРОГРЕСС-БАР С НУЛЯ ---
    let progressBar = element.querySelector('.b-progress');
    if (!progressBar) {
        progressBar = document.createElement('div');
        progressBar.className = 'b-progress';
        progressBar.innerHTML = '<div class="b-progress-fill"></div>';
        element.appendChild(progressBar);
    }
    progressBar.classList.add('active');
    
    // --- СБРАСЫВАЕМ ЗАПОЛНЕНИЕ В 0% ---
    const fill = progressBar.querySelector('.b-progress-fill');
    if (fill) fill.style.width = '0%';
    
    const craftTime = CRAFT_TIME[craftType] || 3000;
    const stepTime = 50; // уменьшил для более плавной анимации
    const steps = craftTime / stepTime;
    let step = 0;
    
    showHarvestPopup(`🔨 Начинаем переработку ${CREATURE_TYPES[resType].resName}...`);
    
    const interval = setInterval(() => {
        step++;
        const progress = Math.min((step / steps) * 100, 100);
        if (fill) {
            fill.style.width = progress + '%';
            fill.style.transition = 'width 0.05s linear'; // плавное заполнение
        }
        
        if (step >= steps) {
            clearInterval(interval);
            buildingData.processing = false;
            element.classList.remove('processing');
            progressBar.classList.remove('active');
            
            craftedItems[craftType] = (craftedItems[craftType] || 0) + 1;
            const product = CRAFTED_PRODUCTS[craftType];
            showHarvestPopup(`✨ Получен ${product.label} ${product.emoji}!`);
            
            element.style.filter = 'drop-shadow(0 0 30px rgba(255,215,0,0.8)) brightness(1.3)';
            setTimeout(() => { element.style.filter = ''; }, 500);
            
            // --- СБРАСЫВАЕМ ПОЛОСУ ПОСЛЕ ЗАВЕРШЕНИЯ ---
            if (fill) {
                fill.style.width = '0%';
                fill.style.transition = 'none';
            }
            
            updateUI();
            checkLevelCompletion();
        }
    }, stepTime);
}
    // ---------- ПОСТРОЙКИ ----------
    function buildBuilding(craftType, x, y) {
        if (isLevelComplete) return false;
        const level = LEVELS[currentLevel];
        if (!level.availableBuildings.includes(craftType)) { showHarvestPopup('❌ Это здание недоступно на этом уровне'); return false; }
        
        const recipe = BUILDING_RECIPES[craftType];
        if (!recipe) return false;
        if (gems < recipe.cost) { showHarvestPopup(`❌ Нужно ${recipe.cost} 💎`); return false; }
        if (!isPositionFree(x, y)) { showHarvestPopup(`❌ Место занято!`); return false; }
        gems -= recipe.cost;
        const div = document.createElement('div');
        div.className = 'building';
        const svg = BUILDING_SVGS[craftType] || BUILDING_SVGS.nest;
        div.innerHTML = svg + `<span class="b-label">${recipe.label}</span><div class="b-progress"><div class="b-progress-fill"></div></div>`;
        div.style.left = (x - 31) + 'px'; div.style.top = (y - 31) + 'px';
        field.appendChild(div);
        const buildingData = { id: Date.now()+'_'+Math.random(), craftType, element: div, x, y, processing: false };
        buildings.push(buildingData);
        div.addEventListener('click', (e) => {
            e.stopPropagation();
            startCrafting(buildingData);
        });
        const bonus = BUILDING_BONUS[craftType]||0;
        gems += bonus;
        showHarvestPopup(`🏗️ Построен ${recipe.label}! (+${bonus} 💎)`);
        updateUI(); 
        checkLevelCompletion();
        return true;
    }

    // ---------- ПОКУПКА ----------
    function buyCreature(typeKey) {
        if (isLevelComplete) return false;
        const level = LEVELS[currentLevel];
        if (!level.availableCreatures.includes(typeKey)) { showHarvestPopup('❌ Это существо недоступно на этом уровне'); return false; }
        
        const type = CREATURE_TYPES[typeKey];
        if (!type) return false;
        if (gems < type.cost) { showHarvestPopup(`❌ Нужно ${type.cost} 💎`); return false; }
        gems -= type.cost;
        const c = spawnCreature(typeKey);
        if (!c) { gems += type.cost; return false; }
        updateUI(); 
        showHarvestPopup(`✅ Куплен ${type.label}`);
        checkLevelCompletion();
        return true;
    }

    // ---------- ПРОДАЖА ----------
    function sellAllResources() {
        if (isLevelComplete) return;
        let total=0, items=[];
        for (let [resType, count] of Object.entries(resources)) if (count>0) { 
            const type = CREATURE_TYPES[resType]; 
            if (type) { 
                total += count*type.sellPrice; 
                items.push(`${type.resName} x${count} (${count*type.sellPrice}💎)`); 
            } 
            resources[resType]=0; 
        }
        for (let [craftType, count] of Object.entries(craftedItems)) {
            if (count > 0) {
                const product = CRAFTED_PRODUCTS[craftType];
                const price = Math.floor(BUILDING_BONUS[craftType] * 1.5);
                total += count * price;
                items.push(`${product.label} x${count} (${count*price}💎)`);
                craftedItems[craftType] = 0;
            }
        }
        if (total===0) { showHarvestPopup('❌ Нет ресурсов'); return; }
        gems += total; 
        updateUI(); 
        showHarvestPopup(`💰 Продано: ${items.join(', ')}. +${total} 💎`);
        checkLevelCompletion();
    }

    // ---------- ПОСТРОЕЧНАЯ ПАНЕЛЬ ----------
    function enterBuildMode(craftType) {
        if (isLevelComplete) return;
        const level = LEVELS[currentLevel];
        if (!level.availableBuildings.includes(craftType)) { showHarvestPopup('❌ Это здание недоступно на этом уровне'); return; }
        
        const recipe = BUILDING_RECIPES[craftType];
        if (!recipe) return;
        if (gems < recipe.cost) { showHarvestPopup(`❌ Нужно ${recipe.cost} 💎`); return; }
        exitBuildMode();
        buildingMode = { craftType, cost: recipe.cost, emoji: recipe.emoji, label: recipe.label };
        field.classList.add('build-mode');
        showHarvestPopup(`🏗️ Выберите место для ${recipe.label}`);
        previewElement = document.createElement('div');
        previewElement.className = 'building-preview';
        previewElement.textContent = recipe.emoji;
        previewElement.style.display = 'none';
        field.appendChild(previewElement);
        updateBuildPanel();
    }
    function exitBuildMode() { buildingMode = null; field.classList.remove('build-mode'); if (previewElement) { previewElement.remove(); previewElement=null; } updateBuildPanel(); }

    function updateBuildPanel() {
        const level = LEVELS[currentLevel];
        const title = buildPanel.querySelector('.panel-title');
        buildPanel.innerHTML = '';
        buildPanel.appendChild(title);
        if (!level) return;
        
        for (let [key, recipe] of Object.entries(BUILDING_RECIPES)) {
            const available = level.availableBuildings.includes(key);
            const has = gems >= recipe.cost;
            const active = buildingMode && buildingMode.craftType === key;
            const item = document.createElement('div');
            item.className = 'build-item' + ((available && has) ? '' : ' disabled');
            if (active) item.style.borderColor = '#f5d742';
            item.innerHTML = `
                <div class="build-top">
                    <span class="build-emoji">${recipe.emoji}</span>
                    <span class="build-name">${recipe.label}</span>
                    <span class="build-cost">💎${recipe.cost}</span>
                </div>
                <div class="build-desc">${recipe.desc}</div>
                ${!available ? `<div class="build-status">🔒 недоступно</div>` : 
                  !has ? `<div class="build-status">❌ не хватает 💎</div>` : 
                  active ? `<div class="build-status" style="color:#f5d742;">🔨 выберите место...</div>` : ''}
            `;
            if (available && has && !active) item.addEventListener('click', ()=>enterBuildMode(key));
            else if (active) item.addEventListener('click', ()=>exitBuildMode());
            buildPanel.appendChild(item);
        }
    }

    // ---------- ОБРАБОТЧИКИ ПОЛЯ ----------
    function handleFieldClick(e) {
        if (isLevelComplete) return;
        if (buildingMode) {
            const rect = field.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            if (isPositionFree(x, y)) { if (buildBuilding(buildingMode.craftType, x, y)) exitBuildMode(); }
            else showHarvestPopup(`❌ Место занято!`);
            return;
        }
        if (water >= 1) {
            const rect = field.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            if (spawnGrass(x, y)) { water -= 1; updateUI(); updateWellDisplay(); showHarvestPopup('🌱 Посажена трава!'); }
            else showHarvestPopup('❌ Нет места');
        } else showHarvestPopup('💧 Нет воды!');
    }
    function handleFieldMove(e) {
        if (!buildingMode || !previewElement) return;
        const rect = field.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        previewElement.style.left = (x - 31) + 'px'; previewElement.style.top = (y - 31) + 'px';
        previewElement.style.display = 'flex';
        previewElement.classList.toggle('invalid', !isPositionFree(x, y));
    }

    // ---------- СБРОС ВСЕХ ДАННЫХ ----------
    function resetGame() {
        levelStars = new Array(20).fill(0);
        levelCompleted = new Array(20).fill(false);
        unlockedLevel = 0;
        renderLevelMenu();
        levelMenu.classList.remove('hidden');
        levelComplete.classList.remove('show');
        clearField();
        if (gameLoopInterval) clearInterval(gameLoopInterval);
        if (levelTimer) clearInterval(levelTimer);
        showHarvestPopup('🔄 Прогресс сброшен');
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function initGame() {
        renderLevelMenu();
        // Начинаем с первого уровня
        startLevel(0);
        
        // Обработчики
        field.addEventListener('click', handleFieldClick);
        field.addEventListener('mousemove', handleFieldMove);
        field.addEventListener('mouseleave', ()=>{ if(previewElement) previewElement.style.display='none'; });
        
        document.querySelectorAll('.shop-btn').forEach(b=>b.addEventListener('click', ()=>{ 
            const t=b.dataset.creature; 
            if(t) buyCreature(t); 
        }));
        
        sellAllBtn.addEventListener('click', sellAllResources);
        
        nextLevelBtn.addEventListener('click', () => {
            if (currentLevel + 1 < LEVELS.length) {
                startLevel(currentLevel + 1);
            } else {
                levelComplete.classList.remove('show');
                levelMenu.classList.remove('hidden');
                showHarvestPopup('🏆 Вы прошли все уровни!');
            }
        });
        
        menuBtn.addEventListener('click', () => {
            levelComplete.classList.remove('show');
            levelMenu.classList.remove('hidden');
        });
        
        field.addEventListener('mouseover', (e)=>{ const c=e.target.closest('.creature'); if(c) c.style.filter='drop-shadow(0 0 20px #f5d742)'; });
        field.addEventListener('mouseout', (e)=>{ const c=e.target.closest('.creature'); if(c) c.style.filter='drop-shadow(0 8px 12px rgba(0,0,0,0.7))'; });
        
        console.log('🌿 Сказочная ферма с 20 уровнями — Civ IV Edition! Уменьшенное поле и скругления.');
    }

    initGame();
})();
</script>
